name: check

on:
  push:
  pull_request:

permissions:
  contents: read

# The same two halves as npm run check, side by side: the browsers each run on their own runner.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The server tests run on Deno too, as an edge runtime.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:static

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One browser failing still lets the others report.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # npm run check:browser, one browser each (a unit test keeps the two lists equal).
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - run: npm run test:react -- --project=${{ matrix.browser }}
      - run: npm run test:pack -- --project=${{ matrix.browser }}
