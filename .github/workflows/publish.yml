name: publish

# Started by hand from the Actions tab. A dry run is the default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Wait for check on this commit, pack, publish nothing
        type: boolean
        default: true

permissions:
  contents: read
  # Reads check.yml's runs, to publish only a commit that passed it.
  actions: read
  # Signs the provenance: the record that the package was built from this commit.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # check.yml checks every pushed commit; this waits for its verdict instead of a rerun.
      - name: This commit passed check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 "${CHECK_TRIES:-75}"); do
            state=$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            case "$state" in
              "completed success") echo "check passed on $GITHUB_SHA"; exit 0 ;;
              completed*) echo "check did not pass on $GITHUB_SHA: $state"; exit 1 ;;
            esac
            sleep "${CHECK_WAIT:-20}"
          done
          echo "check did not finish on $GITHUB_SHA within 25 minutes"
          exit 1
      # A dry run only warns, so it can rehearse before the version is bumped.
      - name: The version has its CHANGELOG entry
        continue-on-error: ${{ inputs.dry_run }}
        run: |
          version=$(node -p "require('./package.json').version")
          # The dots of the version are literal, not "any character".
          pattern="^## $(printf '%s' "$version" | sed 's/[.]/\\./g')( |$)"
          heading=$(grep -cE "$pattern" CHANGELOG.md || true)
          if [ "$heading" -ne 1 ]; then
            echo "CHANGELOG.md has no '## ${version}' entry for package.json's version ${version}"
            exit 1
          fi
          unreleased=$(grep -E "$pattern" CHANGELOG.md | grep -ciE "not (yet )?released|unreleased" || true)
          if [ "$unreleased" -ne 0 ]; then
            echo "CHANGELOG.md's '## ${version}' heading still says it is not released"
            exit 1
          fi
      - name: A real publish comes from main only
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish runs from main, not ${GITHUB_REF}"
            exit 1
          fi
      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --provenance --access public --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        # No token: npm trusts this workflow and its npm environment (trusted publishing).
        run: npm publish --provenance --access public
